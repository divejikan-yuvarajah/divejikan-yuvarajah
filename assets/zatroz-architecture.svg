<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Software, AI, and delivery systems that ship intelligent products">
  <defs>
    <linearGradient id="za-bg" x1="0" y1="0" x2="1600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#0C0908"/>
    </linearGradient>
    <linearGradient id="za-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="za-hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B10" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF3B10" stop-opacity="0"/>
    </radialGradient>
    <filter id="za-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="360" fill="url(#za-bg)"/>
  <rect x="16" y="16" width="1568" height="328" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <text x="48" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#7A7A7A">SYSTEM MAP</text>
  <text x="1552" y="48" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#FF3B10">ZATROZ</text>

  <g>
    <rect x="80" y="72" width="400" height="168" rx="6" fill="url(#za-card)" stroke="#2A2A2A">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="72" width="4" height="168" fill="#FF3B10" opacity="0.85"/>
    <text x="108" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.4" fill="#FF3B10">01</text>
    <text x="108" y="146" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2F2F2">SOFTWARE</text>
    <text x="108" y="178" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">Java  &#183;  Spring Boot  &#183;  APIs</text>
    <text x="108" y="202" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">React  &#183;  Next.js  &#183;  Data</text>
  </g>

  <g>
    <rect x="600" y="72" width="400" height="168" rx="6" fill="url(#za-card)" stroke="#2A2A2A">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="5s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="72" width="4" height="168" fill="#FF3B10" opacity="0.85"/>
    <text x="628" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.4" fill="#FF3B10">02</text>
    <text x="628" y="146" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2F2F2">INTELLIGENCE</text>
    <text x="628" y="178" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">LLMs  &#183;  RAG  &#183;  Embeddings</text>
    <text x="628" y="202" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">Agents  &#183;  MCP  &#183;  GenAI</text>
  </g>

  <g>
    <rect x="1120" y="72" width="400" height="168" rx="6" fill="url(#za-card)" stroke="#2A2A2A">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="5s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1120" y="72" width="4" height="168" fill="#FF3B10" opacity="0.85"/>
    <text x="1148" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.4" fill="#FF3B10">03</text>
    <text x="1148" y="146" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#F2F2F2">DELIVERY</text>
    <text x="1148" y="178" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">AWS  &#183;  Linux  &#183;  Automation</text>
    <text x="1148" y="202" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#9A9A9A">n8n  &#183;  Cloud  &#183;  Shipping</text>
  </g>

  <g stroke="#FF3B10" stroke-width="1.1" fill="none" opacity="0.28">
    <path d="M480,156 H600"/>
    <path d="M1000,156 H1120"/>
    <path d="M280,240 V276 H1320 V240"/>
  </g>
  <g fill="none" stroke="#FF3B10" stroke-width="1.3" stroke-dasharray="6 12" opacity="0.7">
    <path d="M480,156 H600">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1000,156 H1120">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M280,240 V276 H800">
      <animate attributeName="stroke-dashoffset" values="0;-54" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1320,240 V276 H800">
      <animate attributeName="stroke-dashoffset" values="0;-54" dur="3.6s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FF3B10">
    <circle r="2.4">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M480,156 H600"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4">
      <animateMotion dur="3.2s" begin="1s" repeatCount="indefinite" path="M1000,156 H1120"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.1">
      <animateMotion dur="5.4s" repeatCount="indefinite" path="M280,240 V276 H800"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.1">
      <animateMotion dur="5.4s" begin="1.6s" repeatCount="indefinite" path="M1320,240 V276 H800"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" dur="5.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8">
      <animateMotion dur="4.6s" begin="2.2s" repeatCount="indefinite" path="M600,156 H480"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4.6s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <ellipse cx="800" cy="300" rx="90" ry="22" fill="url(#za-hub)"/>
  <circle cx="800" cy="276" r="5.5" fill="#FF3B10" filter="url(#za-glow)">
    <animate attributeName="r" values="4.8;6.4;4.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="800" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2" fill="#F2F2F2">
    INTELLIGENT PRODUCTS
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
