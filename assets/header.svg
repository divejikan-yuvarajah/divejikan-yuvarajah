<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yuvarajah Divejikan - Elevating Code With Creativity and Data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04141c"/>
      <stop offset="50%" stop-color="#06222e"/>
      <stop offset="100%" stop-color="#041821"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#22d3ee;#06b6d4;#0ea5e9;#67e8f9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#0ea5e9;#67e8f9;#22d3ee;#06b6d4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <path opacity="0.32" fill="#22d3ee"
        d="M0,210 C150,170 300,250 450,210 C600,170 750,250 900,210 C1050,170 1200,250 1350,210 L1350,260 L0,260 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,210 C150,170 300,250 450,210 C600,170 750,250 900,210 C1050,170 1200,250 1350,210 L1350,260 L0,260 Z;M0,210 C150,250 300,170 450,210 C600,250 750,170 900,210 C1050,250 1200,170 1350,210 L1350,260 L0,260 Z;M0,210 C150,170 300,250 450,210 C600,170 750,250 900,210 C1050,170 1200,250 1350,210 L1350,260 L0,260 Z"/>
  </path>
  <path opacity="0.18" fill="#0ea5e9"
        d="M0,225 C150,195 300,255 450,225 C600,195 750,255 900,225 C1050,195 1200,255 1350,225 L1350,260 L0,260 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,225 C150,195 300,255 450,225 C600,195 750,255 900,225 C1050,195 1200,255 1350,225 L1350,260 L0,260 Z;M0,225 C150,255 300,195 450,225 C600,255 750,195 900,225 C1050,255 1200,195 1350,225 L1350,260 L0,260 Z;M0,225 C150,195 300,255 450,225 C600,195 750,255 900,225 C1050,195 1200,255 1350,225 L1350,260 L0,260 Z"/>
  </path>
  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="50" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="100" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="120" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="140" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="118" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="56" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="2">Yuvarajah Divejikan</text>
  <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#a5e8f5" letter-spacing="1.5">&#10024; Elevating Code With Creativity &amp; Data &#10024;</text>
</svg>
