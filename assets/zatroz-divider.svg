  <circle r="3" fill="#FF3B10" filter="url(#zd-glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M120,18 L1480,18"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FF8A6A">
    <animateMotion dur="8s" begin="2.2s" repeatCount="indefinite" path="M1480,18 L120,18"/>
