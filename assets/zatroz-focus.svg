    </rect>
    <rect x="56" y="72" width="4" height="132" fill="#FF3B10"/>
    <text x="84" y="112" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#FF3B10">01</text>
    <text x="84" y="148" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F2F2">BUILD</text>
    <text x="84" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#8A8A8A">AI products + backends</text>
  </g>
  <g>
