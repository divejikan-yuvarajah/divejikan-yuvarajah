    <text x="460" y="148" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F2F2">LEARN</text>
    <text x="460" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#8A8A8A">RAG  &#183;  Agents  &#183;  MCP</text>
