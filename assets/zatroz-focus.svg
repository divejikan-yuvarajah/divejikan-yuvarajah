    <text x="836" y="112" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#FF3B10">03</text>
    <text x="836" y="148" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F2F2">COMPETE</text>
